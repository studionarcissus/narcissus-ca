<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narcissus | Self-Love, Boxed.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
--cream:#f8f4ef;
--warm:#f3ede5;
--text:#2d2a26;
--muted:#77706a;
--accent:#c9b8a3;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Inter',sans-serif;
color:var(--text);
background:#fff;
line-height:1.7;
}

img{width:100%;display:block;}

.container{
width:min(1200px,92%);
margin:auto;
}

section{padding:100px 0;}

h1,h2,h3{
font-family:'Cormorant Garamond',serif;
font-weight:600;
}

h1{font-size:clamp(3rem,8vw,6rem);line-height:1;}
h2{font-size:clamp(2.3rem,5vw,4rem);margin-bottom:20px;}

p{color:var(--muted);font-size:1.05rem;}

header{
position:fixed;
top:0;
width:100%;
background:rgba(255,255,255,.92);
backdrop-filter:blur(12px);
z-index:1000;
border-bottom:1px solid rgba(0,0,0,.05);
}

.nav{
height:80px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{height:48px;width:auto;}

.instagram{text-decoration:none;color:var(--text);}

.hero{padding-top:120px;}

.hero-grid{
display:grid;
grid-template-columns:1.2fr 1fr;
gap:70px;
align-items:center;
}

.hero-image{border-radius:28px;overflow:hidden;}

.btn{
padding:14px 28px;
border-radius:999px;
text-decoration:none;
font-weight:500;
}

.btn-primary{background:var(--text);color:#fff;}
.btn-secondary{border:1px solid #ddd;color:var(--text);}

.story{background:var(--cream);}

.story-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
align-items:center;
}

.features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
}

.feature{
padding:40px;
border:1px solid #eee;
border-radius:24px;
}

.collections{background:var(--warm);}

.collection{
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
margin-bottom:80px;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:25px;
}

.waitlist{
background:var(--text);
color:#fff;
text-align:center;
}

.email-box{
display:flex;
justify-content:center;
gap:10px;
margin-top:30px;
flex-wrap:wrap;
}

.email-box input{
padding:16px;
width:320px;
border:none;
border-radius:999px;
}

.email-box button{
padding:16px 28px;
border:none;
border-radius:999px;
cursor:pointer;
}

.success{
margin-top:20px;
color:#b7ffb7;
display:none;
}

@media(max-width:900px){
.hero-grid,.story-grid,.collection{grid-template-columns:1fr;}
.features{grid-template-columns:1fr;}
.gallery{grid-template-columns:1fr;}
h1{font-size:4rem;}
}

</style>
</head>

<body>

<header>
<div class="container nav">
<img src="images/logo.jpg" class="logo">
<a class="instagram" href="https://instagram.com/studionarcissus" target="_blank">@studionarcissus</a>
</div>
</header>

<section class="hero">
<div class="container hero-grid">

<div class="hero-image">
<img src="images/hero.jpg">
</div>

<div>
<h1>Self-Love,<br>Boxed.</h1>
<p>Curated self-care experiences designed to help you slow down.</p>

<a href="#waitlist" class="btn btn-primary">Join Waitlist</a>
</div>

</div>
</section>

<section class="story">
<div class="container story-grid">
<div>
<h2>A Moment That Belongs To You</h2>
<p>Meaningful self-care rituals for calm and joy.</p>
</div>
<img src="images/lifestyle.jpg">
</div>
</section>

<section class="waitlist" id="waitlist">
<div class="container">

<h2>Be First To Know</h2>
<p>Join the waitlist.</p>

<form class="email-box"
action="https://formspree.io/f/maqzlvvd"
method="POST"
onsubmit="showSuccess()">

<input type="email" name="email" placeholder="Your email address" required>

<button type="submit">Notify Me</button>

</form>

<div class="success" id="successMsg">
✨ You’re in. Welcome to Narcissus.
</div>

</div>
</section>

<script>
function showSuccess(){
setTimeout(()=>{
document.getElementById("successMsg").style.display="block";
},300);
}
</script>

</body>
</html>
